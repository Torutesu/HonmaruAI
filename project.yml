name: TikTokForWork
options:
  bundleIdPrefix: com.tangle
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  TikTokForWork:
    type: application
    platform: iOS
    sources:
      - path: TikTokForWork
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tangle.tiktokforwork
        INFOPLIST_FILE: TikTokForWork/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: TikTok for Work
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Sync decision cards with your team in real time.
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies: []
