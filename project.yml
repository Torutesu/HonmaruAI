name: TikTokForWork
options:
  bundleIdPrefix: com.tangle
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  # Japanese ships as a real localization rather than by rewriting the source
  # strings, so English survives for review and anywhere outside Japan.
  developmentLanguage: en
  knownRegions: [en, ja, Base]

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.30.0

targets:
  TikTokForWork:
    type: application
    platform: iOS
    # No entitlements file on purpose. Adding `aps-environment` requires the
    # provisioning profile to carry it, and "HonmaruAI AppStore" was issued
    # before push existed — an archive would fail to sign. Turning push on is a
    # four-part change; PushService.isEnabledInThisBuild lists all of it.
    sources:
      - path: TikTokForWork
        excludes:
          - PrivacyInfo.xcprivacy
      # Named on its own so it lands in Resources. xcodegen has no build phase
      # for an extension it does not recognise, and a privacy manifest that is
      # not copied into the bundle fails review exactly as if it were absent.
      - path: TikTokForWork/PrivacyInfo.xcprivacy
        buildPhase: resources
    # RELAY_SCHEME / RELAY_HOST live here rather than in `settings` below,
    # because target settings outrank an xcconfig and would make
    # Config/Local.xcconfig (written by scripts/device.sh) have no effect.
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        # The App Store Connect record is com.honmaru.ai. The target, directory
        # and Xcode project keep the old name on purpose — renaming them touches
        # every file on this branch and buys nothing a user can see.
        PRODUCT_BUNDLE_IDENTIFIER: com.honmaru.ai
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: TikTokForWork/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Honmaru AI
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Sync decision cards with your team in real time.
        # iPhone only. Including iPad ("1,2") while declaring portrait only makes
        # Apple reject the upload with ITMS-90474.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # Release is signed manually against an App Store profile. Automatic
        # signing archives with a development identity first, and a development
        # profile needs a registered device — so an automatic archive cannot be
        # produced without a phone plugged in, which TestFlight exists to avoid.
        # Creating the certificate and profile: docs/app-store-release.md.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: iPhone Distribution
          PROVISIONING_PROFILE_SPECIFIER: HonmaruAI AppStore
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - package: RevenueCat
        product: RevenueCatUI

  # Unit tests over the logic that decides what a user sees and what reaches
  # their teammates. Views are deliberately out of scope — a snapshot test of a
  # SwiftUI hierarchy breaks on every design change and catches none of the
  # failures that matter here.
  TikTokForWorkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TikTokForWorkTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.honmaru.ai.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: TikTokForWork

schemes:
  TikTokForWork:
    build:
      targets:
        TikTokForWork: all
        TikTokForWorkTests: [test]
    # Configs are named rather than left to the default, because
    # scripts/release.sh drives `xcodebuild archive` through this scheme and an
    # archive that silently picked Debug would ship an unsigned, un-optimised
    # build that still says BUILD SUCCEEDED.
    test:
      config: Debug
      targets:
        - TikTokForWorkTests
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
