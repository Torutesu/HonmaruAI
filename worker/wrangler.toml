name = "tiktokforwork"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[triggers]
# Connectors used to sync only while the app was open — the one moment you do
# not need it. Fifteen minutes is the compromise between "already there when you
# look" and a model bill that scales with idle installs.
crons = ["*/15 * * * *", "* * * * *"]

[[durable_objects.bindings]]
name = "ORG_RELAY"
class_name = "OrgRelay"

# Agents answer from here: research outlasts a request's half minute
# (src/agentRunner.js).
[[durable_objects.bindings]]
name = "AGENT_RUNNER"
class_name = "AgentRunner"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OrgRelay"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AgentRunner"]

[[d1_databases]]
binding = "DB"
database_name = "tiktokforwork"
database_id = "08d78a7f-45eb-4837-8393-4f7c92bf39cb"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "tiktokforwork-media"

# The audit log's sealed archive (docs/audit-log-phase2.md §3). Apart from
# MEDIA because its prefix is under a bucket lock: nothing in it is deleted
# before the lock's age, by anyone. The deploy workflow makes the bucket and
# the lock the first time.
[[r2_buckets]]
binding = "AUDIT_ARCHIVE"
bucket_name = "tiktokforwork-audit"

# Staging: the same Worker under another name, with its own relay, database
# and bucket, so a branch can be tried against real Cloudflare without
# touching what customers use. `wrangler deploy --env staging` reads this
# block; the Deploy Worker workflow does that for a push to the `staging`
# branch, or by hand with its "environment" input.
#
# Two resources exist once, made by the owner (see docs/setup-secrets.md):
#   npx wrangler@4 d1 create tiktokforwork-staging      → paste database_id below
#   npx wrangler@4 r2 bucket create tiktokforwork-media-staging
# Secrets are per environment: `wrangler secret put NAME --env staging`.
[env.staging]
name = "tiktokforwork-staging"

[env.staging.triggers]
crons = ["*/15 * * * *", "* * * * *"]

[[env.staging.durable_objects.bindings]]
name = "ORG_RELAY"
class_name = "OrgRelay"

[[env.staging.durable_objects.bindings]]
name = "AGENT_RUNNER"
class_name = "AgentRunner"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "tiktokforwork-staging"
# Placeholder until the database exists. The deploy workflow refuses to
# deploy staging while this is all zeros.
database_id = "00000000-0000-0000-0000-000000000000"

[[env.staging.r2_buckets]]
binding = "MEDIA"
bucket_name = "tiktokforwork-media-staging"

[[env.staging.r2_buckets]]
binding = "AUDIT_ARCHIVE"
bucket_name = "tiktokforwork-audit-staging"
