name: Deploy Worker

# The backend deploys itself. Doing it by hand means remembering to migrate D1
# before deploying — and the one time that is forgotten, every sign-in fails
# against tables that do not exist yet.
#
# Needs two repository secrets, once:
#   CLOUDFLARE_API_TOKEN   — an API token with "Edit Cloudflare Workers" plus
#                            D1:Edit on the account
#   CLOUDFLARE_ACCOUNT_ID  — from the Cloudflare dashboard URL
#
# Without them the job stops with an explanation instead of failing in the
# middle of a deploy.

# Two environments. `main` deploys production; the `staging` branch deploys
# the staging Worker (its own name, relay, database and bucket — see
# `[env.staging]` in worker/wrangler.toml), so a branch can be tried against
# real Cloudflare without touching what customers use. By hand, the
# "environment" input picks either.
on:
  push:
    branches: [main, staging]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
      - ".github/scripts/migrate-columns.cjs"
      - ".github/scripts/ci-dependency.cjs"
  workflow_dispatch:
    inputs:
      environment:
        description: "Which Worker to deploy"
        type: choice
        options: [production, staging]
        default: production
      migrate_only:
        description: "Run the D1 migration but do not deploy"
        type: boolean
        default: false
      app_web_url:
        description: "Set APP_WEB_URL (where invite and notification links open), e.g. https://app.honmaruai.com. Empty = leave it"
        type: string
        default: ""

concurrency:
  group: deploy-worker-${{ inputs.environment || (github.ref_name == 'staging' && 'staging' || 'production') }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and deploy
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_DOMAINS_API_TOKEN: ${{ secrets.PAGES_DOMAINS_API_TOKEN }}
      TARGET: ${{ inputs.environment || (github.ref_name == 'staging' && 'staging' || 'production') }}
    steps:
      - uses: actions/checkout@v7

      # One place decides the three things that differ: the wrangler flag,
      # the D1 database name, and the URL to verify after.
      - name: Pick the environment
        id: target
        run: |
          echo "Deploying: $TARGET"
          if [ "$TARGET" = "staging" ]; then
            if grep -q '00000000-0000-0000-0000-000000000000' wrangler.toml; then
              echo "::error::Staging has no database yet. Run 'npx wrangler@4 d1 create tiktokforwork-staging' and paste its id into [env.staging] in worker/wrangler.toml (docs/setup-secrets.md)."
              exit 1
            fi
            echo "flag=--env staging" >> "$GITHUB_OUTPUT"
            echo "db=tiktokforwork-staging" >> "$GITHUB_OUTPUT"
            echo "health=https://tiktokforwork-staging.torubj0904.workers.dev/health" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "db=tiktokforwork" >> "$GITHUB_OUTPUT"
            echo "health=https://tiktokforwork.torubj0904.workers.dev/health" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Check credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository secrets."
            echo "Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi

      - run: npm ci

      # Automatic pushes reuse the full CI run for this exact commit. The helper
      # fails closed on failure, cancellation, API errors, or a missing run.
      - name: Wait for matching CI
        if: github.event_name == 'push'
        timeout-minutes: 65
        uses: actions/github-script@v8
        env:
          CI_BRANCH: ${{ github.ref_name }}
          CI_REVISION: ${{ github.sha }}
        with:
          script: |
            const { waitForCiSuccess } = require(process.env.GITHUB_WORKSPACE + '/.github/scripts/ci-dependency.cjs');
            const run = await waitForCiSuccess({ github, repo: context.repo, revision: process.env.CI_REVISION, branch: process.env.CI_BRANCH });
            core.info('CI passed: ' + run.html_url);

      # A manual dispatch may have no automatic CI run to reuse. Keep testing
      # before migrations, including for migrate_only.
      - name: Test manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: npm test

      # Every statement is CREATE … IF NOT EXISTS, so this is safe to run on
      # every deploy and safe to re-run after a failure.
      #
      # wrangler@4 explicitly: the pinned wrangler 3 fails `d1 execute --remote`
      # with a 7403 "account is not authorized" that is a stale-client bug, not
      # an auth problem, and reads exactly like a broken token.
      # Every statement here is CREATE ... IF NOT EXISTS, so this is safe to run
      # on every deploy and safe to re-run after a failure.
      - name: Migrate D1
        run: npx -y wrangler@4 d1 execute ${{ steps.target.outputs.db }} ${{ steps.target.outputs.flag }} --remote --file schema.sql --yes

      # Ordered D1 compatibility changes for databases predating the current schema.
      # The migration script applies each ALTER, DDL, and backfill in order,
      # because one D1 error otherwise aborts the rest of a migration file.
      - name: Migrate D1 (column additions)
        run: node ../.github/scripts/migrate-columns.cjs ${{ steps.target.outputs.db }} ${{ steps.target.outputs.flag }}


      # The web app's address lives in a Worker secret. Changing it here keeps
      # the change in the Actions log instead of on someone's laptop.
      - name: Set the web app address
        if: ${{ inputs.app_web_url != '' && !inputs.migrate_only }}
        env:
          APP_WEB_URL: ${{ inputs.app_web_url }}
        run: |
          case "$APP_WEB_URL" in https://*) ;; *) echo "::error::app_web_url must start with https://"; exit 1 ;; esac
          printf '%s' "${APP_WEB_URL%/}" | npx -y wrangler@4 secret put APP_WEB_URL ${{ steps.target.outputs.flag }}

      # The audit archive's bucket, and the lock that keeps its audit/ prefix
      # for 400 days (docs/audit-log-phase2.md §3.2). Made once; a lock rule
      # already there is left as it is.
      - name: Audit archive bucket
        if: ${{ !inputs.migrate_only }}
        run: |
          bucket="tiktokforwork-audit"
          [ "$TARGET" = "staging" ] && bucket="tiktokforwork-audit-staging"
          if npx -y wrangler@4 r2 bucket list | grep -q "$bucket"; then
            echo "$bucket: exists"
          else
            npx -y wrangler@4 r2 bucket create "$bucket"
          fi
          if npx -y wrangler@4 r2 bucket lock list "$bucket" 2>/dev/null | grep -q "audit/"; then
            echo "lock: already set"
          else
            npx -y wrangler@4 r2 bucket lock add "$bucket" --name audit-400d --prefix audit/ --retention-days 400 --force || echo "::warning::Could not add the bucket lock; add it by hand (docs/setup-secrets.md)."
          fi

      # The media bucket keeps what it holds. Attachments, workspace emoji,
      # profile photos and logos live there, and the app deletes each when
      # somebody removes it, never by age. A 30-day expiry put on the whole
      # bucket by hand for video clips (August 2026) deleted every older
      # picture and file (#824). Any rule that expires objects is taken off
      # here, on every deploy, so it cannot come back unnoticed. A list that
      # cannot be read is a warning, never "no rules".
      - name: Media bucket keeps what it holds
        if: ${{ !inputs.migrate_only }}
        run: |
          bucket="tiktokforwork-media"
          [ "$TARGET" = "staging" ] && bucket="tiktokforwork-media-staging"
          if ! rules="$(npx -y wrangler@4 r2 bucket lifecycle list "$bucket" 2>&1)"; then
            echo "::warning::Could not read the lifecycle rules of $bucket: $(printf '%s' "$rules" | tail -n 1)"
            exit 0
          fi
          printf '%s\n' "$rules"
          printf '%s\n' "$rules" | awk '/^name:/ {sub(/^name:[ \t]+/, ""); n=$0} /^action:/ && /Expire objects/ {print n}' | while IFS= read -r name; do
            npx -y wrangler@4 r2 bucket lifecycle remove "$bucket" --name "$name"
            echo "::warning::Removed lifecycle rule '$name' from $bucket: it deleted attachments and pictures by age (#824)."
          done

      # Keys the Worker makes once and must never lose: the audit log's key
      # wrapper and pseudonym key (docs/audit-log-phase2.md §2). Created here
      # the first time, when the Worker has none — never replaced, because
      # replacing one would make every entry written under it unreadable.
      # If the list cannot be read, nothing is generated: a failed read must
      # never look like "none set". Made before the deploy: production
      # refuses to serve without them (REQUIRE_ENCRYPTION).
      - name: Generated secrets
        if: ${{ !inputs.migrate_only }}
        run: |
          have="$(npx -y wrangler@4 secret list ${{ steps.target.outputs.flag }})" || { echo "::error::Could not list the Worker's secrets; not generating any."; exit 1; }
          printf '%s' "$have" | grep -q '^[[:space:]]*\[' || { echo "::error::Unexpected answer listing secrets; not generating any."; exit 1; }
          for name in AUDIT_MASTER_KEY AUDIT_PSEUDONYM_KEY SSO_SECRET_KEY DATA_KEY; do
            if printf '%s' "$have" | grep -q "\"$name\""; then
              echo "$name: already set"
            else
              echo "$name: generating"
              openssl rand -base64 32 | tr -d '\n' | npx -y wrangler@4 secret put "$name" ${{ steps.target.outputs.flag }}
            fi
          done
          # The account, for the spend brake's analytics query (spendGuard.js).
          # Its token (CF_ANALYTICS_TOKEN, Account Analytics: Read) is made by
          # a person in the dashboard; without it the brake does nothing.
          if ! printf '%s' "$have" | grep -q '"CF_ACCOUNT_ID"'; then
            printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | npx -y wrangler@4 secret put CF_ACCOUNT_ID ${{ steps.target.outputs.flag }}
          fi
          # App domains only need Pages Write. Keep this separate from
          # the much broader deploy token; it is optional and production-only.
          if [ "$TARGET" = "production" ] && [ -n "$PAGES_DOMAINS_API_TOKEN" ]; then
            printf '%s' "$PAGES_DOMAINS_API_TOKEN" | npx -y wrangler@4 secret put PAGES_DOMAINS_API_TOKEN
          fi
          # The archive's signing key: Ed25519, as PKCS8. Its public half is
          # served at /audit/public-key; a replaced key is listed there only if
          # AUDIT_PAST_PUBLIC_KEYS names it, so this too is made once.
          if printf '%s' "$have" | grep -q '"AUDIT_SIGNING_KEY"'; then
            echo "AUDIT_SIGNING_KEY: already set"
          else
            echo "AUDIT_SIGNING_KEY: generating"
            node -e "const c=require('crypto');process.stdout.write(c.generateKeyPairSync('ed25519').privateKey.export({type:'pkcs8',format:'der'}).toString('base64'))" | npx -y wrangler@4 secret put AUDIT_SIGNING_KEY ${{ steps.target.outputs.flag }}
          fi

      - name: Deploy
        if: ${{ !inputs.migrate_only }}
        # --keep-vars preserves dashboard-managed non-secret runtime variables
        # as well as secrets; the flag picks the environment.
        # Production refuses to serve without its encryption keys
        # (REQUIRE_ENCRYPTION), and the check after the deploy fails on it.
        run: npx -y wrangler@4 deploy --keep-vars ${{ steps.target.outputs.flag }} ${{ env.TARGET == 'production' && '--var REQUIRE_ENCRYPTION:1' || '' }}

      - name: Verify
        if: ${{ !inputs.migrate_only }}
        run: |
          # A deploy that reports success but serves a broken build is worth ten
          # seconds to rule out.
          for attempt in 1 2 3 4 5; do
            body="$(curl -fsS ${{ steps.target.outputs.health }} || true)"
            if [ -n "$body" ]; then
              echo "$body"
              if echo "$body" | grep -q '"ok":true'; then
                # Production: data, the audit log and SSO secrets sealed.
                if [ "$TARGET" = "production" ] && ! echo "$body" | grep -q '"all":true'; then
                  echo "::error::Production is running without its encryption keys (DATA_KEY, AUDIT_*, SSO_SECRET_KEY)."
                  exit 1
                fi
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::/health did not report ok after the deploy."
          exit 1

      - name: Check the web app address
        if: ${{ inputs.app_web_url != '' && !inputs.migrate_only }}
        env:
          APP_WEB_URL: ${{ inputs.app_web_url }}
        run: |
          got=$(curl -fsS ${{ steps.target.outputs.health }} | jq -r .webUrl)
          [ "$got" = "${APP_WEB_URL%/}" ] || { echo "::error::/health reports webUrl $got, not ${APP_WEB_URL%/}"; exit 1; }
          echo "invite and notification links now open $got"
