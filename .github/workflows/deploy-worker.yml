name: Deploy Worker

# The backend deploys itself. Doing it by hand means remembering to migrate D1
# before deploying — and the one time that is forgotten, every sign-in fails
# against tables that do not exist yet.
#
# Needs two repository secrets, once:
#   CLOUDFLARE_API_TOKEN   — an API token with "Edit Cloudflare Workers" plus
#                            D1:Edit on the account
#   CLOUDFLARE_ACCOUNT_ID  — from the Cloudflare dashboard URL
#
# Without them the job stops with an explanation instead of failing in the
# middle of a deploy.

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:
    inputs:
      migrate_only:
        description: "Run the D1 migration but do not deploy"
        type: boolean
        default: false

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Check credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository secrets."
            echo "Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi

      - run: npm ci

      # Deploying code whose tests fail is how a broken relay reaches everyone at
      # once. The suite runs against real workerd, so this is not a formality.
      - name: Test
        run: npm test

      # schema.sql is generated from migrations/. If someone edited it directly,
      # the change would be in the tests and never in production.
      - name: Check schema is in sync with migrations
        run: npm run schema:check

      # Numbered migrations, applied in order and recorded, so a change that is
      # not a CREATE — an index, a dropped table — reaches production too. The
      # first migration is the original schema and is all CREATE … IF NOT
      # EXISTS, so applying it to the database that was built by hand is a
      # no-op rather than a conflict.
      #
      # The devDependency is wrangler 4 now, so this is the same client the
      # tests ran against. Wrangler 3 failed `d1` commands with a 7403 "account
      # is not authorized" that was a stale-client bug rather than an auth
      # problem, and read exactly like a broken token.
      - name: Migrate D1
        run: npx wrangler d1 migrations apply tiktokforwork --remote

      - name: Deploy
        if: ${{ !inputs.migrate_only }}
        run: npx wrangler deploy

      - name: Verify
        if: ${{ !inputs.migrate_only }}
        run: |
          # A deploy that reports success but serves a broken build is worth ten
          # seconds to rule out.
          for attempt in 1 2 3 4 5; do
            body="$(curl -fsS https://tiktokforwork.torubj0904.workers.dev/health || true)"
            if [ -n "$body" ]; then
              echo "$body"
              # ok is false when D1 is unreachable, which is a deploy that
              # serves 500s to every signed-in person.
              echo "$body" | grep -q '"ok":true' && exit 0
            fi
            sleep 5
          done
          echo "::error::/health did not report ok after the deploy."
          exit 1
