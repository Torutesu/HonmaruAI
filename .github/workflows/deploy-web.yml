name: Deploy Web

# The web client deploys itself to Cloudflare Pages, the way the Worker
# does. `web-react/scripts/deploy-pages.sh` is the same thing from a laptop
# with a wrangler login; this is that script with the questions answered.
#
# The backend host is baked into the build. There is no field on the sign-in
# screen to correct it afterwards, so a build that forgot it is a page that
# quietly tries to reach localhost and never connects — which is why the
# bundle is checked for the host before anything is uploaded.
#
# Uses the same two repository secrets as Deploy Worker. The API token needs
# "Cloudflare Pages: Edit" on the account as well as the Workers permissions;
# without it the deploy step fails with an authentication error and nothing
# on the site changes.

on:
  push:
    branches: [main]
    paths:
      - "web-react/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:
    inputs:
      api_host:
        description: "Worker host the page talks to (no scheme)"
        type: string
        default: tiktokforwork.torubj0904.workers.dev
      project:
        description: "Cloudflare Pages project"
        type: string
        default: honmaru-web

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-react
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_HOST: ${{ inputs.api_host || 'tiktokforwork.torubj0904.workers.dev' }}
      PROJECT: ${{ inputs.project || 'honmaru-web' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-react/package-lock.json

      - name: Check credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository secrets."
            exit 1
          fi

      - run: npm ci

      # A page that does not know its backend is not worth uploading.
      - name: Build against the Worker
        run: |
          echo "backend: $API_HOST"
          VITE_API_HOST="$API_HOST" npm run build
          [ -f dist/sw.js ] || { echo "::error::dist/sw.js is missing; push would not work."; exit 1; }
          grep -q "$API_HOST" dist/assets/*.js || { echo "::error::The host did not make it into the build."; exit 1; }

      - name: Test
        run: npx vitest run

      - name: Deploy to Pages
        run: npx -y wrangler@4 pages deploy dist --project-name="$PROJECT" --branch=main --commit-dirty=true

      # The site serves what was just built: the bundle's own file name is the
      # proof, since every build gets a new hash.
      - name: Verify
        run: |
          asset=$(ls dist/assets/index-*.js | head -1 | xargs basename)
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "https://$PROJECT.pages.dev/" | grep -q "$asset"; then
              echo "https://$PROJECT.pages.dev serves $asset"
              exit 0
            fi
            sleep 10
          done
          echo "::error::https://$PROJECT.pages.dev does not serve $asset yet."
          exit 1
