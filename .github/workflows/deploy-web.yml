name: Deploy Web

# The web client deploys itself to Cloudflare Pages, the way the Worker
# does. `web-react/scripts/deploy-pages.sh` is the same thing from a laptop
# with a wrangler login; this is that script with the questions answered.
#
# The backend host is baked into the build. There is no field on the sign-in
# screen to correct it afterwards, so a build that forgot it is a page that
# quietly tries to reach localhost and never connects — which is why the
# bundle is checked for the host before anything is uploaded.
#
# The app's own address is app.honmaruai.com (or the APP_DOMAIN repository
# variable): each run attaches it to the Pages project and, when the token may
# edit that zone's DNS, points it there; otherwise the run's warning names
# the record to add. pages.dev keeps serving the app as well.
#
# Uses the same two repository secrets as Deploy Worker. The API token needs
# "Cloudflare Pages: Edit" on the account as well as the Workers permissions;
# without it the deploy step fails with an authentication error and nothing
# on the site changes.

on:
  push:
    branches: [main]
    paths:
      - "web-react/**"
      # The web imports what every client shares (packages/core).
      - "packages/**"
      - ".github/workflows/deploy-web.yml"
      - ".github/scripts/attach-pages-domain.sh"
      - ".github/scripts/worker-dependency.cjs"
      - ".github/scripts/migrate-columns.cjs"
  workflow_dispatch:
    inputs:
      api_host:
        description: "Worker host the page talks to (no scheme)"
        type: string
        default: tiktokforwork.torubj0904.workers.dev
      project:
        description: "Cloudflare Pages project"
        type: string
        default: honmaru-web

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-react
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_HOST: ${{ inputs.api_host || 'tiktokforwork.torubj0904.workers.dev' }}
      PROJECT: ${{ inputs.project || 'honmaru-web' }}
      APP_HOST: ${{ vars.APP_DOMAIN || 'app.honmaruai.com' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-react/package-lock.json

      - name: Check credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository secrets."
            exit 1
          fi

      - run: npm ci

      # A page that does not know its backend is not worth uploading.
      - name: Build against the Worker
        run: |
          echo "backend: $API_HOST"
          VITE_API_HOST="$API_HOST" npm run build
          [ -f dist/sw.js ] || { echo "::error::dist/sw.js is missing; push would not work."; exit 1; }
          grep -q "$API_HOST" dist/assets/*.js || { echo "::error::The host did not make it into the build."; exit 1; }

      - name: Test
        run: npx vitest run

      # New UI may depend on new tables/routes. Never publish it while the
      # latest Worker migration/deploy included in this release is pending or
      # failed, even when a later Web-only commit triggered this release.
      - name: Find this release's Worker dependency
        id: backend
        if: github.event_name == 'push'
        run: |
          revision=$(git log --first-parent -1 --format=%H HEAD -- ../worker ../.github/workflows/deploy-worker.yml ../.github/scripts/migrate-columns.cjs)
          [ -n "$revision" ] || { echo "::error::Cannot identify the Worker dependency."; exit 1; }
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      # A previous Worker release can be ahead in the serialized queue.
      # Allow both test/migration runs without deploying an unready backend.
      - name: Wait for the matching Worker deployment
        timeout-minutes: 65
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        env:
          WORKER_REVISION: ${{ steps.backend.outputs.revision }}
        with:
          script: |
            const { workerDependency } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/worker-dependency.cjs`);
            const revision = process.env.WORKER_REVISION;
            const ancestry = new Map();
            const deadline = Date.now() + 60 * 60 * 1000;
            while (Date.now() < deadline) {
              const { state, run } = await workerDependency({ github, repo: context.repo, revision, ancestry });
              if (state !== 'pending') {
                if (state === 'failed') {
                  core.setFailed(`Worker deployment ${run.html_url} ended with ${run.conclusion}; Web remains unchanged.`);
                } else {
                  core.info(`Worker is ready: ${run.html_url}`);
                }
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 20000));
            }
            core.setFailed(`Timed out waiting for Worker dependency ${revision}; Web remains unchanged.`);

      - name: Deploy to Pages
        run: npx -y wrangler@4 pages deploy dist --project-name="$PROJECT" --branch=main --commit-dirty=true

      - name: Attach the app domain
        working-directory: .
        run: .github/scripts/attach-pages-domain.sh "$PROJECT" "${APP_HOST#*.}" "$APP_HOST"

      # The site serves what was just built: the bundle's own file name is the
      # proof, since every build gets a new hash.
      - name: Verify
        run: |
          asset=$(ls dist/assets/index-*.js | head -1 | xargs basename)
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "https://$PROJECT.pages.dev/" | grep -q "$asset"; then
              echo "https://$PROJECT.pages.dev serves $asset"
              exit 0
            fi
            sleep 10
          done
          echo "::error::https://$PROJECT.pages.dev does not serve $asset yet."
          exit 1

      # Informational until its DNS record exists: the app on its own domain.
      - name: Check the app domain
        run: |
          asset=$(ls dist/assets/index-*.js | head -1 | xargs basename)
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS -m 15 "https://$APP_HOST/" 2>/dev/null | grep -q "$asset"; then
              echo "https://$APP_HOST serves $asset"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::https://$APP_HOST does not serve the app yet (its DNS record or certificate is missing); https://$PROJECT.pages.dev does."

