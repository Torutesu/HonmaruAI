name: Windows Store submission package
on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/desktop/**
      - .github/workflows/windows-store-package.yml
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Preserve source line endings for CSP hashes
        working-directory: ${{ runner.temp }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build Store-only AppX
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx --no-install electron-builder --config electron-builder.store.yml --win appx --x64 --publish never
      - name: Verify identity, update policy and submission evidence
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem dist -Filter '*-store.appx')
          if ($packages.Count -ne 1) { throw 'Expected exactly one Store AppX.' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($packages[0].FullName)
          try {
            $entry = $archive.GetEntry('AppxManifest.xml')
            if (!$entry) { throw 'AppxManifest.xml missing.' }
            $reader = [IO.StreamReader]::new($entry.Open())
            try { [xml]$manifest = $reader.ReadToEnd() } finally { $reader.Dispose() }
            if ($manifest.Package.Identity.Name -ne 'Selectinc.HonmaruAI') { throw 'Store identity mismatch.' }
            if ($manifest.Package.Identity.Publisher -ne 'CN=7CDC932B-05F3-4A36-884F-635FD02769E0') { throw 'Store publisher mismatch.' }
            if ($manifest.Package.Identity.ProcessorArchitecture -ne 'x64') { throw 'Unexpected architecture.' }
          } finally { $archive.Dispose() }
          $asar = 'dist/win-unpacked/resources/app.asar'
          if (!(Test-Path $asar)) { throw 'Packaged app archive missing.' }
          node --input-type=module -e "import { createRequire } from 'node:module'; const require=createRequire(import.meta.url); const asar=require('@electron/asar'); const pkg=JSON.parse(asar.extractFile('dist/win-unpacked/resources/app.asar','package.json')); if(pkg.honmaruUpdates !== false) throw new Error('Store build must disable GitHub updates');"
          [ordered]@{
            commit = '${{ github.sha }}'
            package = $packages[0].Name
            sha256 = (Get-FileHash $packages[0].FullName -Algorithm SHA256).Hash
            identity = [string]$manifest.Package.Identity.Name
            version = [string]$manifest.Package.Identity.Version
            distribution = 'Microsoft Store submission only; not a signed direct-download installer'
            remaining = 'Partner Center identity readback, certification, installed-app QA and publication'
          } | ConvertTo-Json | Set-Content dist/store-package-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: Honmaru-AI-Windows-Store-x64-submission
          path: |
            apps/desktop/dist/*-store.appx
            apps/desktop/dist/store-package-evidence.json
          if-no-files-found: error
          retention-days: 14
