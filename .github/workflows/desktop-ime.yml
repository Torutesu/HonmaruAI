name: Mac app Japanese input

# The Mac app (apps/desktop) on a real Mac, typed into with Apple's own
# Japanese input method: real keystrokes, romaji in, kana and kanji out, into
# the real web client on the real local stack (e2e/desktop-ime.mjs).
#
# Emulated IME events cannot catch what goes wrong between macOS and Electron
# — letters arriving as Latin while the menu bar still says あ — so this is
# the check for an Electron upgrade, the shell, and the client's Enter
# handling together. macOS minutes cost ten times Linux ones: it runs when
# those change, and on demand.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "e2e/desktop-ime.mjs"
      - "e2e/mac-keys.swift"
      - "web-react/src/utils/keys.ts"
      - ".github/workflows/desktop-ime.yml"
  push:
    branches: [main]
    paths:
      - "apps/desktop/package.json"
      - "apps/desktop/src/**"
      - "e2e/desktop-ime.mjs"
      - "e2e/mac-keys.swift"
      - ".github/workflows/desktop-ime.yml"

permissions:
  contents: read

jobs:
  ime:
    name: Japanese input in the Mac app
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The Mac app's own packages (Electron included)
        working-directory: apps/desktop
        run: npm ci
      - name: Can this machine type?
        # Keystrokes posted without Accessibility trust go nowhere, and the
        # test would then fail as if the app had dropped them. Say which.
        run: |
          swift e2e/mac-keys.swift status
          swift e2e/mac-keys.swift japanese
      - run: E2E_SPEC=e2e/desktop-ime.mjs ./e2e/run.sh
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-ime-screenshots
          path: /tmp/e2e-shots
          if-no-files-found: ignore
      - name: Startup diagnostics
        if: failure()
        run: |
          for log in /tmp/e2e-d1.log /tmp/e2e-worker.log /tmp/e2e-build.log /tmp/e2e-preview.log; do
            [ -f "$log" ] && tail -n 40 "$log"
          done
