name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  relay:
    # Also runs the Swift contract test, which parses the iOS models and
    # asserts the relay's JSON still fits them — the compiler check no Linux
    # runner can perform.
    name: Relay (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server

  web:
    name: Web (unit + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The integration suite boots the real relay, so it needs relay deps.
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: web
      # Tests assert against the real build output, so build first.
      - run: npm run build
        working-directory: web
      - run: npm test
        working-directory: web

  e2e:
    name: Web (browser E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
