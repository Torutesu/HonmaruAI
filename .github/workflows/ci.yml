name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # On demand, for a branch that changed Swift and has no pull request yet:
  # the iOS job below runs on pull requests only, so this is the one way to
  # compile a branch's Swift before opening one.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Worker suite runs against real workerd, so a pass here means the relay,
  # the gate and the connectors behave the way they will in production — not the
  # way a mock was told to.
  worker:
    name: Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test

  # The reference relay imports the Worker's AG-UI layer rather than keeping its
  # own copy, so a change over there can break it. Nothing ran these tests
  # before, which is how the two copies drifted far enough for a fix to land in
  # the one nobody runs.
  relay:
    name: Reference relay
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  # The React reference client. Kept alongside the single-file demo the relay
  # serves at GET / — that one is for poking at the protocol by hand, this one
  # is the worked example of a real client — and built here so neither rots
  # unnoticed.
  web:
    name: Reference web client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-react/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx vitest run

  # The one suite that runs the product rather than its parts: a real Worker on
  # real workerd, a real D1, the built web client, and a browser signing up with
  # a code it reads out of the message the Worker actually sent. It existed and
  # nothing ran it — not here, and not from a clean clone either, because the
  # browser driver it imports was in nobody's package.json.
  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: ./e2e/run.sh
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: /tmp/e2e-shots
          if-no-files-found: ignore

  # macOS minutes are expensive, so this runs on pull requests only. Pushing to
  # a branch gets the Worker suite; asking to merge gets the whole thing.
  ios:
    name: iOS
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling
        # xcbeautify is not preinstalled on every runner image, and with
        # `pipefail` set a missing one fails the step in a way that looks like a
        # build error.
        run: |
          brew install xcodegen xcbeautify
          command -v jq >/dev/null || brew install jq
      - name: Generate the project
        run: xcodegen generate
      - name: Pick a simulator
        # Naming a device model pins this job to whatever the runner image
        # happened to ship the day it was written. It stopped shipping an
        # "iPhone 16", and xcodebuild then failed at destination resolution —
        # before compiling a single file — which reads in the checks list as
        # the app failing to build. Ask the machine what it actually has:
        # an iPhone if there is one, otherwise any device with an iOS runtime.
        id: sim
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available --json | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.isAvailable)] | (map(select(.name | startswith("iPhone"))) + .) | .[0].udid // empty')
          if [ -z "$udid" ]; then
            echo "This runner has no iOS simulator. What it does have:" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          xcrun simctl list devices available | grep -F "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project TikTokForWork.xcodeproj \
            -scheme TikTokForWork \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify
