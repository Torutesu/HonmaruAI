name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Worker suite runs against real workerd, so a pass here means the relay,
  # the gate and the connectors behave the way they will in production — not the
  # way a mock was told to.
  worker:
    name: Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      # schema.sql is generated from migrations/. Edited directly, a change
      # lands in the tests and never in production.
      - run: npm run schema:check
      # An unawaited promise on a Worker is not a slow path: it is a write that
      # may not have happened when the response goes out.
      - run: npm run lint
      - run: npm test

  # SwiftUI draws `Text("Save")` from the catalogue and `Text(someString)`
  # verbatim, and the difference is invisible until a Japanese phone shows
  # English. This catches every literal that is not in the catalogue.
  localization:
    name: Localization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/check-localization.mjs

  # The reference relay imports the Worker's AG-UI layer rather than keeping its
  # own copy, so a change over there can break it. Nothing ran these tests
  # before, which is how the two copies drifted far enough for a fix to land in
  # the one nobody runs.
  relay:
    name: Reference relay
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  # The React reference client. Kept alongside the single-file demo the relay
  # serves at GET / — that one is for poking at the protocol by hand, this one
  # is the worked example of a real client — and built here so neither rots
  # unnoticed.
  web:
    name: Reference web client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-react/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx vitest run

  # macOS minutes are expensive, so this runs on pull requests only. Pushing to
  # a branch gets the Worker suite; asking to merge gets the whole thing.
  # Compiles on every push, tests on pull requests.
  #
  # It used to be pull requests only, which meant a branch could take twenty
  # commits of Swift without one of them ever being compiled — and the first
  # thing to notice was a pull request going red on something introduced
  # fifteen commits earlier. Building is a couple of minutes; running the
  # simulator is the expensive half, and that still waits for the pull request.
  ios:
    name: iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling
        # xcbeautify is not preinstalled on every runner image, and with
        # `pipefail` set a missing one fails the step in a way that looks like a
        # build error.
        run: brew install xcodegen xcbeautify
      - name: Generate the project
        run: xcodegen generate

      # No device name: a generic simulator destination compiles everything,
      # including the test target, without depending on which iPhone the runner
      # image happens to ship this month.
      - name: Build
        if: github.event_name != 'pull_request'
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project TikTokForWork.xcodeproj \
            -scheme TikTokForWork \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      # Resolved rather than pinned: a hard-coded "iPhone 16" fails the day the
      # runner image moves on, and reads as a broken test rather than a missing
      # simulator.
      # Resolved rather than pinned: a hard-coded "iPhone 16" fails the day the
      # runner image moves on, and reads as a broken test rather than a missing
      # simulator.
      - name: Pick a simulator
        if: github.event_name == 'pull_request'
        id: sim
        run: |
          name="$(xcrun simctl list devices available \
            | grep -oE 'iPhone [0-9][A-Za-z0-9 ]*' \
            | sed 's/ *$//' | sort -V | tail -1)"
          if [ -z "$name" ]; then
            echo "::error::No iPhone simulator available on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Using $name"

      - name: Test
        if: github.event_name == 'pull_request'
        run: |
          set -o pipefail
          xcodebuild test \
            -project TikTokForWork.xcodeproj \
            -scheme TikTokForWork \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }},OS=latest" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify
