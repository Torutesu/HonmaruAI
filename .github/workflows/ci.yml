name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # On demand, for a branch that changed Swift and has no pull request yet:
  # the iOS job below runs on pull requests only, so this is the one way to
  # compile a branch's Swift before opening one.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Worker suite runs against real workerd, so a pass here means the relay,
  # the gate and the connectors behave the way they will in production — not the
  # way a mock was told to.
  worker:
    name: Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test

  # The reference relay imports the Worker's AG-UI layer rather than keeping its
  # own copy, so a change over there can break it. Nothing ran these tests
  # before, which is how the two copies drifted far enough for a fix to land in
  # the one nobody runs.
  relay:
    name: Reference relay
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  # The React reference client. Kept alongside the single-file demo the relay
  # serves at GET / — that one is for poking at the protocol by hand, this one
  # is the worked example of a real client — and built here so neither rots
  # unnoticed.
  web:
    name: Reference web client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-react/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx vitest run

  # The desktop shell (apps/desktop): its rules — where the window may go,
  # what a honmaru:// link opens, the unread count, window placement — are
  # plain modules, tested without downloading Electron itself.
  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node --check src/main.js && node --check src/preload.cjs

  # What every client shares (packages/core, packages/protocol) and the Expo
  # app built on it (apps/mobile): the shared tests, both typechecks, and the
  # app bundled for iOS and Android — so a change to the shared code that
  # breaks the phone is caught here, not on a device.
  clients:
    name: Shared core and mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Every app at the version in VERSION
        run: node scripts/check-versions.mjs
      - run: npm ci
      - run: npm test --workspace @honmaru/core
      - run: npm run typecheck --workspace @honmaru/core
      - run: npm run typecheck --workspace @honmaru/mobile
      - name: Bundle the app for iOS and Android
        working-directory: apps/mobile
        run: CI=1 npx expo export --platform ios --platform android --output-dir dist

  # The one suite that runs the product rather than its parts: a real Worker on
  # real workerd, a real D1, the built web client, and a browser signing up with
  # a code it reads out of the message the Worker actually sent. It existed and
  # nothing ran it — not here, and not from a clean clone either, because the
  # browser driver it imports was in nobody's package.json.
  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: ./e2e/run.sh
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: /tmp/e2e-shots
          if-no-files-found: ignore
      - name: E2E startup diagnostics
        if: failure()
        run: |
          for log in /tmp/e2e-d1.log /tmp/e2e-worker.log /tmp/e2e-build.log /tmp/e2e-preview.log /tmp/e2e-browser.log; do
            if [ -f "$log" ]; then
              tail -n 40 "$log"
            fi
          done

  # The office PC: Windows and Microsoft Edge, where most of the people who
  # will use this at work are. It drives the same real stack as `e2e` above
  # through the checks that only go wrong there — the Enter that confirms a
  # Japanese conversion, Ctrl shortcuts, a 1366×768 screen (e2e/windows.mjs).
  # Windows minutes cost double, so like iOS it runs on pull requests only.
  windows:
    name: Windows (Edge)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # Git for Windows checks text out with CRLF by default, and bash will not
      # run a script whose lines end in \r.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Windows checks in Microsoft Edge
        env:
          E2E_SPEC: e2e/windows.mjs
          E2E_CHANNEL: msedge
          E2E_SHOTS: ${{ runner.temp }}/e2e-shots
        run: ./e2e/run.sh
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-screenshots
          path: ${{ runner.temp }}/e2e-shots
          if-no-files-found: ignore
      - name: Startup diagnostics
        if: failure()
        run: |
          for log in /tmp/e2e-d1.log /tmp/e2e-worker.log /tmp/e2e-build.log /tmp/e2e-preview.log; do
            if [ -f "$log" ]; then
              echo "--- $log"
              tail -n 40 "$log"
            fi
          done

  # macOS minutes are expensive, so this runs on pull requests only. Pushing to
  # a branch gets the Worker suite; asking to merge gets the whole thing.
  ios:
    name: iOS
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling
        # xcbeautify is not preinstalled on every runner image, and with
        # `pipefail` set a missing one fails the step in a way that looks like a
        # build error.
        run: |
          brew install xcodegen xcbeautify
          command -v jq >/dev/null || brew install jq
      - name: Generate the project
        run: xcodegen generate
      - name: Review configuration regression gate
        run: node scripts/verify-review-config.mjs
      - name: Pick a simulator
        # Naming a device model pins this job to whatever the runner image
        # happened to ship the day it was written. It stopped shipping an
        # "iPhone 16", and xcodebuild then failed at destination resolution —
        # before compiling a single file — which reads in the checks list as
        # the app failing to build. Ask the machine what it actually has:
        # an iPhone if there is one, otherwise any device with an iOS runtime.
        id: sim
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available --json | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.isAvailable)] | (map(select(.name | startswith("iPhone"))) + .) | .[0].udid // empty')
          if [ -z "$udid" ]; then
            echo "This runner has no iOS simulator. What it does have:" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          xcrun simctl list devices available | grep -F "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project TikTokForWork.xcodeproj \
            -scheme TikTokForWork \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -skipPackagePluginValidation \
            -resultBundlePath "$RUNNER_TEMP/ios.xcresult" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | xcbeautify
      # xcbeautify keeps only a failure's first line: what a UI test printed
      # about the screen it saw (ReviewFlowUITests' tapShowingTheScreen) is in the
      # raw log, and the screenshots are in the result bundle.
      - name: What the UI tests saw
        if: failure()
        run: grep -n -A150 "tapShowingTheScreen:" "$RUNNER_TEMP/xcodebuild.log" | head -600 || echo "no UI test printed the screen"
      - name: Test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/ios.xcresult
          if-no-files-found: ignore
