name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Worker suite runs against real workerd, so a pass here means the relay,
  # the gate and the connectors behave the way they will in production — not the
  # way a mock was told to.
  worker:
    name: Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test

  # macOS minutes are expensive, so this runs on pull requests only. Pushing to
  # a branch gets the Worker suite; asking to merge gets the whole thing.
  ios:
    name: iOS
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate the project
        run: xcodegen generate
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project TikTokForWork.xcodeproj \
            -scheme TikTokForWork \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify
