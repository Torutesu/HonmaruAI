name: Deploy Landing Page

# The landing page (lp/) is static HTML with a small build (lp/build.mjs: a
# page per language, a root worker that picks one by country, minified
# assets). This puts it on Cloudflare Pages the way Deploy Web puts the client
# there, with the same two repository secrets. The API token needs
# "Cloudflare Pages: Edit".
#
# The Pages project is created on the first run if it does not exist yet, and
# the site's domain (honmaruai.com, or the LP_DOMAIN repository variable) and
# its www. are attached to it. When the token may also edit that zone's DNS,
# the records are added too; otherwise the run says which to add. The page is
# built for the domain as soon as the domain answers: its links and previews
# name it, and the pages.dev and www. addresses redirect to it. Until then it
# is built for the pages.dev address, so nothing points at a dead domain.

on:
  push:
    branches: [main]
    paths:
      - "lp/**"
      - ".github/workflows/deploy-lp.yml"
      - ".github/scripts/attach-pages-domain.sh"
  workflow_dispatch:
    inputs:
      project:
        description: "Cloudflare Pages project"
        type: string
        default: honmaru-lp
      site_url:
        description: "Public URL the page is served from (for link previews). Empty = the domain once it answers, else the pages.dev address"
        type: string
        default: ""

concurrency:
  group: deploy-lp
  cancel-in-progress: false

jobs:
  deploy:
    name: Check and deploy
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: ${{ inputs.project || 'honmaru-lp' }}
      SITE_URL: ${{ inputs.site_url || vars.LP_SITE_URL || '' }}
      DOMAIN: ${{ vars.LP_DOMAIN || 'honmaruai.com' }}
      APP_HOST: ${{ vars.APP_DOMAIN || 'app.honmaruai.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository secrets."
            exit 1
          fi

      - name: Create the Pages project if needed
        run: |
          if npx -y wrangler@4 pages project list 2>/dev/null | grep -qw "$PROJECT"; then
            echo "$PROJECT exists"
          else
            npx -y wrangler@4 pages project create "$PROJECT" --production-branch=main
          fi

      # Attaches the domain and www. to the project (idempotent). Pages then
      # issues their certificates once DNS points at it. Nothing here fails
      # the deploy: without the domain the page stays on pages.dev.
      - name: Attach the domain
        run: .github/scripts/attach-pages-domain.sh "$PROJECT" "$DOMAIN" "$DOMAIN" "www.$DOMAIN"

      # The domain is live when its root is answered by this page's worker
      # (a redirect to a language). Only then is the page built for it.
      - name: Pick the address
        run: |
          if [ -z "$SITE_URL" ]; then
            loc=$(curl -s -o /dev/null -m 15 -w '%{http_code} %{redirect_url}' "https://$DOMAIN/" || true)
            case "$loc" in
              "302 https://$DOMAIN/"??/|"301 https://$DOMAIN/"??/) SITE_URL="https://$DOMAIN" ;;
              *) echo "::notice::https://$DOMAIN/ is not serving the page yet ($loc); building for $PROJECT.pages.dev"; SITE_URL="https://$PROJECT.pages.dev" ;;
            esac
          fi
          echo "SITE_URL=${SITE_URL%/}" >> "$GITHUB_ENV"
          echo "building for ${SITE_URL%/}"
          # Links to the web app use app.<domain> once it serves the app.
          web="https://honmaru-web.pages.dev"
          if curl -fsS -m 15 "https://$APP_HOST/" 2>/dev/null | grep -q 'id="root"'; then web="https://$APP_HOST"; fi
          echo "WEB_URL=$web" >> "$GITHUB_ENV"
          echo "web app links go to $web"

      # lp/build.mjs writes a page per language with its words already in the
      # HTML, inlines the stylesheet, minifies the scripts, and adds the
      # worker that sends Japan to /ja/ and everyone else to /en/ (and, for a
      # domain, the other addresses to it). It stops, naming the key, if a
      # language is missing a string the page uses.
      - name: Test and build
        run: |
          node --check lp/main.js
          node --test lp/worker.test.mjs
          node lp/build.mjs dist "$SITE_URL" "$WEB_URL"
          ls -la dist dist/ja

      - name: Deploy to Pages
        run: npx -y wrangler@4 pages deploy dist --project-name="$PROJECT" --branch=main --commit-dirty=true

      # The copy on the live page is this commit's copy.
      # This commit is live: each language page is the one just built, and
      # the root redirects (a runner is outside Japan, so /en/; the cookie a
      # language choice sets, to that language).
      - name: Verify
        run: |
          base="$SITE_URL"
          pages="https://$PROJECT.pages.dev"
          for attempt in 1 2 3 4 5 6 7 8; do
            ok=1
            for l in en ja es fr de; do
              curl -fsS "$base/$l/" | cmp -s - "dist/$l/index.html" || ok=0
            done
            curl -fsS "$base/main.js" | cmp -s - dist/main.js || ok=0
            root=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "$base/")
            [ "$root" = "302 $base/en/" ] || ok=0
            chosen=$(curl -sS -o /dev/null -w '%{redirect_url}' -H 'Cookie: hm_lang=ja' "$base/")
            [ "$chosen" = "$base/ja/" ] || ok=0
            if [ "$base" != "$pages" ]; then
              moved=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "$pages/ja/")
              [ "$moved" = "301 $base/ja/" ] || ok=0
            fi
            if [ $ok = 1 ]; then
              echo "$base serves this commit; / -> /en/ from here, /ja/ for a Japanese choice"
              [ "$base" != "$pages" ] && echo "$pages redirects to $base"
              exit 0
            fi
            echo "not yet (root: $root, with ja cookie: $chosen)"
            sleep 10
          done
          echo "::error::$base does not serve this commit as built."
          exit 1
