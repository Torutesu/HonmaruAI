name: Deploy Landing Page

# The landing page (lp/) is static HTML with a small build (lp/build.mjs: a
# page per language, a root worker that picks one by country, minified
# assets). This puts it on Cloudflare Pages the way Deploy Web puts the client
# there, with the same two repository secrets. The API token needs
# "Cloudflare Pages: Edit".
#
# The Pages project is created on the first run if it does not exist yet.
# Attaching a custom domain (honmaruai.com) is a one-time step in the
# Cloudflare dashboard: Pages → the project → Custom domains.

on:
  push:
    branches: [main]
    paths:
      - "lp/**"
      - ".github/workflows/deploy-lp.yml"
  workflow_dispatch:
    inputs:
      project:
        description: "Cloudflare Pages project"
        type: string
        default: honmaru-lp
      site_url:
        description: "Public URL the page is served from (for link previews). Empty = the pages.dev address"
        type: string
        default: ""

concurrency:
  group: deploy-lp
  cancel-in-progress: false

jobs:
  deploy:
    name: Check and deploy
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: ${{ inputs.project || 'honmaru-lp' }}
      SITE_URL: ${{ inputs.site_url || vars.LP_SITE_URL || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository secrets."
            exit 1
          fi

      # lp/build.mjs writes a page per language with its words already in the
      # HTML, inlines the stylesheet, minifies the scripts, and adds the root
      # worker that sends Japan to /ja/ and everyone else to /en/. It stops,
      # naming the key, if a language is missing a string the page uses.
      - name: Test and build
        run: |
          node --check lp/main.js
          node --test lp/worker.test.mjs
          url="${SITE_URL:-https://$PROJECT.pages.dev}"
          node lp/build.mjs dist "${url%/}"
          ls -la dist dist/ja

      - name: Create the Pages project if needed
        run: |
          if npx -y wrangler@4 pages project list 2>/dev/null | grep -qw "$PROJECT"; then
            echo "$PROJECT exists"
          else
            npx -y wrangler@4 pages project create "$PROJECT" --production-branch=main
          fi

      - name: Deploy to Pages
        run: npx -y wrangler@4 pages deploy dist --project-name="$PROJECT" --branch=main --commit-dirty=true

      # The copy on the live page is this commit's copy.
      # This commit is live: each language page is the one just built, and
      # the root redirects (a runner is outside Japan, so /en/; the cookie a
      # language choice sets, to that language).
      - name: Verify
        run: |
          base="https://$PROJECT.pages.dev"
          for attempt in 1 2 3 4 5 6 7 8; do
            ok=1
            for l in en ja es fr de; do
              curl -fsS "$base/$l/" | cmp -s - "dist/$l/index.html" || ok=0
            done
            curl -fsS "$base/main.js" | cmp -s - dist/main.js || ok=0
            root=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "$base/")
            [ "$root" = "302 $base/en/" ] || ok=0
            chosen=$(curl -sS -o /dev/null -w '%{redirect_url}' -H 'Cookie: hm_lang=ja' "$base/")
            [ "$chosen" = "$base/ja/" ] || ok=0
            if [ $ok = 1 ]; then
              echo "$base serves this commit; / -> /en/ from here, /ja/ for a Japanese choice"
              exit 0
            fi
            echo "not yet (root: $root, with ja cookie: $chosen)"
            sleep 10
          done
          echo "::error::$base does not serve this commit as built."
          exit 1
