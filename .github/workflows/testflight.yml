name: TestFlight
on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version
        required: true
        type: string
      validation_run:
        description: Prior run with successful tests and Release smoke for identical source (optional)
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: testflight
  cancel-in-progress: false
jobs:
  upload:
    name: Test, sign and upload
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      VERSION: ${{ inputs.version }}
      TEAM: BAF4U6PT5S
    steps:
      - uses: actions/checkout@v4
      - name: Check credentials and version
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          CERT: ${{ secrets.IOS_DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          for name in API_KEY API_ISSUER API_P8 CERT CERT_PASSWORD PROFILE; do
            [ -n "${!name}" ] || { echo "::error::Missing $name"; exit 1; }
          done
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          xcodebuild -version
      - name: Install tools and generate project
        run: |
          brew install xcodegen xcbeautify
          xcodegen generate
          node scripts/verify-review-config.mjs
      - name: Verify prior validation
        if: inputs.validation_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RUN: ${{ inputs.validation_run }}
        run: |
          set -euo pipefail
          [[ "$VALIDATION_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATION_RUN" > "$RUNNER_TEMP/prior-run.json"
          jq -e '.status == "completed" and .path == ".github/workflows/testflight.yml"' "$RUNNER_TEMP/prior-run.json"
          PRIOR_SHA=$(jq -r .head_sha "$RUNNER_TEMP/prior-run.json")
          git fetch origin "$PRIOR_SHA"
          # Only this workflow may differ. App, tests, dependencies and build settings must be identical.
          git diff --exit-code "$PRIOR_SHA" HEAD -- . ':!.github/workflows/testflight.yml'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATION_RUN/jobs?per_page=100" > "$RUNNER_TEMP/prior-jobs.json"
          jq -e '.jobs | any(.steps as $s | all(["Unit and UI tests", "Release smoke launch"][]; . as $name | any($s[]; .name == $name and .conclusion == "success")))' "$RUNNER_TEMP/prior-jobs.json"
          echo "Reused successful tests and Release smoke from run $VALIDATION_RUN ($PRIOR_SHA); identical app source." >> "$GITHUB_STEP_SUMMARY"
      - name: Select simulator
        if: inputs.validation_run == ''
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json | jq -r '[.devices|to_entries[]|select(.key|contains("iOS"))|.value[]|select(.isAvailable and (.name|startswith("iPhone")))][0].udid // empty')
          [ -n "$UDID" ]
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
      - name: Unit and UI tests
        if: inputs.validation_run == ''
        run: |
          set -o pipefail
          xcodebuild test -project TikTokForWork.xcodeproj -scheme TikTokForWork \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -skipPackagePluginValidation -resultBundlePath "$RUNNER_TEMP/ios.xcresult" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- | xcbeautify
      - name: Release smoke launch
        if: inputs.validation_run == ''
        run: ./scripts/smoke-release.sh
      - name: Install signing material
        env:
          CERT: ${{ secrets.IOS_DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          API_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN="$RUNNER_TEMP/ios-signing.keychain-db"
          PASSWORD=$(uuidgen)
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          printf '%s' "$CERT" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/.private_keys"
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -o - -)
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$UUID.mobileprovision"
          printf '%s' "$API_P8" > "$HOME/.private_keys/AuthKey_$API_KEY.p8"
          rm "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/profile.mobileprovision"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
      - name: Archive and verify signature
        run: |
          set -euo pipefail
          BUILD_NUMBER=$(date -u +%Y%m%d%H%M%S)
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          xcodebuild archive -project TikTokForWork.xcodeproj -scheme TikTokForWork \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/TikTokForWork.xcarchive \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$TEAM" | xcbeautify
          APP=build/TikTokForWork.xcarchive/Products/Applications/TikTokForWork.app
          codesign --verify --deep --strict "$APP"
          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/entitlements.plist"
          [ "$(plutil -extract aps-environment raw "$RUNNER_TEMP/entitlements.plist")" = production ]
          [ "$(plutil -extract get-task-allow raw "$RUNNER_TEMP/entitlements.plist")" = false ]
          [ "$(plutil -extract CFBundleShortVersionString raw "$APP/Info.plist")" = "$VERSION" ]
          [ "$(plutil -extract CFBundleVersion raw "$APP/Info.plist")" = "$BUILD_NUMBER" ]
          echo "Verified $VERSION ($BUILD_NUMBER), source $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Export
        run: |
          set -o pipefail
          sed "s/__DEVELOPMENT_TEAM__/$TEAM/" scripts/ExportOptions.plist.template > build/ExportOptions.plist
          xcodebuild -exportArchive -archivePath build/TikTokForWork.xcarchive \
            -exportPath build/export -exportOptionsPlist build/ExportOptions.plist | xcbeautify
      - name: Upload to Apple
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          IPA=$(find build/export -name '*.ipa' -print -quit)
          [ -n "$IPA" ]
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$API_KEY" --apiIssuer "$API_ISSUER"
      - name: Keep release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-${{ inputs.version }}-${{ github.run_id }}
          path: |
            build/export/*.ipa
            build/TikTokForWork.xcarchive/Info.plist
            ${{ runner.temp }}/entitlements.plist
            ${{ runner.temp }}/ios.xcresult
          retention-days: 3
          if-no-files-found: warn
      - name: Clean signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/ios-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/profile.mobileprovision"
          rm -f "$HOME/.private_keys/"*.p8
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
