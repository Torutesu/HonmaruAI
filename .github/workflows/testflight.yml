name: TestFlight

# Ship a build without a Mac in front of you.
#
# Everything scripts/release.sh does locally, done on a macOS runner from
# secrets. The signing material has to be handed over once; after that a release
# is pressing "Run workflow".
#
# Repository secrets, all required:
#
#   ASC_KEY_ID          App Store Connect API key id (10 chars)
#   ASC_ISSUER_ID       the issuer UUID shown on the same page
#   ASC_KEY_P8          the .p8 file's contents, verbatim, BEGIN/END lines and all
#   DEVELOPMENT_TEAM    your 10-character team id
#   DIST_CERT_P12       base64 of the distribution certificate as .p12
#                         base64 -i dist.p12 | pbcopy
#   DIST_CERT_PASSWORD  the password that .p12 was exported with
#   PROVISIONING_PROFILE
#                       base64 of the "HonmaruAI AppStore" .mobileprovision
#                         base64 -i profile.mobileprovision | pbcopy
#
# Creating the certificate and profile in the first place, if they do not exist:
# docs/app-store-release.md.
#
# NOTE: this workflow has never run. It was written from the same steps
# scripts/release.sh performs, but signing is the part of iOS releasing that
# fails in ways only a real run reveals — expect to iterate on the first attempt.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version, e.g. 1.0.1"
        required: true
        type: string
      group:
        description: "TestFlight tester group"
        default: "Internal Testers"
        type: string

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Build and upload
    runs-on: macos-15
    env:
      SCHEME: TikTokForWork
      BUNDLE_ID: com.honmaru.ai
      PROFILE_NAME: HonmaruAI AppStore
    steps:
      - uses: actions/checkout@v4

      - name: Check credentials
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 DEVELOPMENT_TEAM \
                      DIST_CERT_P12 DIST_CERT_PASSWORD PROVISIONING_PROFILE; do
            eval "value=\${$name}"
            [ -z "$value" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}

      - name: Install tooling
        run: brew install xcodegen xcbeautify

      # A dedicated keychain, unlocked for this job only. Importing into the
      # login keychain on a shared runner is both unnecessary and a way to leave
      # a certificate behind.
      - name: Import the signing certificate
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASSWORD="$(uuidgen)"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"

          echo -n "${{ secrets.DIST_CERT_P12 }}" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" \
            -P "${{ secrets.DIST_CERT_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a UI prompt nobody can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"

      - name: Install the provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "${{ secrets.PROVISIONING_PROFILE }}" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          # Named by its UUID, which is what Xcode looks it up by.
          UUID="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" \
            | plutil -extract UUID raw -o - -)"
          cp "$RUNNER_TEMP/profile.mobileprovision" \
            ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/profile.mobileprovision"

      - name: Install the App Store Connect API key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" \
            > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          # altool looks in ~/.private_keys; asc looks in ~/.appstoreconnect.
          cp ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 ~/.private_keys/

      - name: Generate the project
        run: xcodegen generate

      # The same guard scripts/release.sh enforces: a Release build that dies on
      # launch passes every Debug check, because the assertion that kills it
      # lives behind `#if !DEBUG`.
      - name: Release smoke launch
        run: ./scripts/smoke-release.sh

      - name: Next build number
        id: build_number
        run: |
          # Asking App Store Connect rather than counting locally, so a build
          # number can never collide with one already uploaded.
          brew install asc || true
          NEXT="$(asc builds next-build-number --output json 2>/dev/null \
            | python3 -c 'import sys,json;print(json.load(sys.stdin).get("data",{}).get("nextBuildNumber",""))' 2>/dev/null || true)"
          # A run number is monotonic and unique, which is the only property that
          # matters if asc cannot answer.
          [ -z "$NEXT" ] && NEXT="${{ github.run_number }}"
          echo "value=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Build number: $NEXT"
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project TikTokForWork.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/TikTokForWork.xcarchive \
            -allowProvisioningUpdates \
            MARKETING_VERSION="${{ inputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.build_number.outputs.value }}" \
            DEVELOPMENT_TEAM="${{ secrets.DEVELOPMENT_TEAM }}" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            | xcbeautify

      - name: Export the ipa
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${{ secrets.DEVELOPMENT_TEAM }}</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/TikTokForWork.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            | xcbeautify

      - name: Upload to TestFlight
        run: |
          IPA="$(find build/export -name '*.ipa' | head -1)"
          [ -z "$IPA" ] && { echo "::error::No .ipa was exported."; exit 1; }
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "${{ secrets.ASC_KEY_ID }}" \
            --apiIssuer "${{ secrets.ASC_ISSUER_ID }}"

      - name: Keep the archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: honmaru-${{ inputs.version }}-${{ steps.build_number.outputs.value }}
          path: |
            build/export/*.ipa
            build/TikTokForWork.xcarchive
          retention-days: 14
          if-no-files-found: warn

      - name: Clean up the keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f ~/.appstoreconnect/private_keys/*.p8 ~/.private_keys/*.p8 || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision || true
