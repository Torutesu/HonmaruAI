# Installers for Windows (NSIS), macOS (DMG, plus the ZIP the updater needs)
# and Linux (AppImage).
#
# Signing (docs/architecture/discord-model-platform-plan.md §11.4) comes from
# the environment — CSC_LINK / CSC_KEY_PASSWORD (or WIN_CSC_LINK) for the
# certificate, APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER (or
# APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID) to notarize — and
# `npm run dist` / `npm run release` refuse to build without it
# (scripts/signing.mjs). `npm run dist:dir` builds an unsigned, unpacked app
# to try locally; it never checks for updates.
appId: com.honmaru.ai
productName: Honmaru AI
copyright: Copyright © Honmaru AI
directories:
  output: dist
  buildResources: resources
files:
  - src/**
  - assets/**
  - package.json
protocols:
  - name: Honmaru AI
    schemes: [honmaru]
# Electron's fuses, switches baked into the binary (#963). Left on, any
# program running as the same person could start Honmaru's signed binary as
# plain Node (ELECTRON_RUN_AS_NODE), inject code through NODE_OPTIONS, or
# attach a debugger with --inspect — and run its own JavaScript as Honmaru,
# with the microphone and camera Honmaru was granted. The app uses none of
# them (no process.fork, no Node child), so they are turned off for every
# build; the Store and App Store configs extend this one.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
# Where `npm run release` uploads the installers and the update feed
# (latest.yml, latest-mac.yml, latest-linux.yml), and where the installed app
# looks for a newer version (src/updates.js). A release is created as a
# draft; publishing it is what offers the update to everyone. electron-updater
# takes the repository's latest published release, so the desktop app's
# releases have to be the newest ones here (or this moves to a repository of
# their own), and each one has to carry every platform's feed file: the
# release workflows copy over those of platforms they did not build and
# check the draft is complete before publishing (scripts/feed.mjs).
publish:
  provider: github
  owner: Torutesu
  repo: HonmaruAI
  releaseType: draft
win:
  target: nsis
nsis:
  oneClick: true
  perMachine: false
mac:
  target: [dmg, zip]
  category: public.app-category.productivity
  hardenedRuntime: true
  # Jam: the microphone and the camera (resources/entitlements.mac.plist).
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Honmaru AI uses the microphone when you join a Jam call.
    NSCameraUsageDescription: Honmaru AI uses the camera when you turn on video in a Jam call.
dmg:
  sign: true
linux:
  target: AppImage
  category: Office
