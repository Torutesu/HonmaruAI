<!-- Source of AppIcon.png. The mark is the tab bar's conic ring with the compose
     FAB at its centre — the same object the web build ships as its favicon, so a
     phone icon, a browser tab and the bar inside the app are one thing.

     The twelve stops are the Figma angular gradient, verbatim. SVG has no conic
     gradient, so the PNG is rendered by scripts/make-app-icon.py rather than from
     this file; this is the readable statement of what it draws. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <rect width="1024" height="1024" fill="#0E0E10"/>
  <!-- The ring: r = 0.2925 * 1024, stroke = 0.085 * 1024. -->
  <circle cx="512" cy="512" r="299.5" fill="none" stroke="#FA24CE" stroke-width="87"/>
  <!-- The FAB. -->
  <circle cx="512" cy="512" r="120.8" fill="#6647F0"/>
</svg>
