<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Honmaru AI</title>
    <meta name="description" content="AI-native decision feed for teams. Tell your AI; the decision reaches whoever makes it, as a card they clear in one swipe." />
    <meta property="og:title" content="Honmaru AI" />
    <meta property="og:description" content="The decision you need to make is already waiting." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon.svg" />
    <meta name="twitter:card" content="summary" />
    <!-- Installable, which is what lets Safari on iOS deliver a push at all
         (16.4+, from the home screen). Chrome and Firefox do not need it,
         but a home-screen icon costs nothing. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/startup-v1.css" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Honmaru" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)" />
    <!-- The theme chosen on You, on the page before its first paint: waiting
         for the app's own script opened a dark choice on a white flash.
         color-scheme is said here too, because the browser paints its canvas
         by that tag before any stylesheet has loaded. utils/appearance.ts
         keeps the key and the two colours; say them the same here. Storage
         that refuses leaves the system to decide. -->
    <script>
      try {
        const theme = localStorage.getItem('theme')
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme
          const scheme = document.querySelector('meta[name="color-scheme"]')
          if (scheme) scheme.setAttribute('content', theme)
          document.querySelectorAll('meta[name="theme-color"]').forEach((meta) => meta.setAttribute('content', theme === 'dark' ? '#0f0f0f' : '#ffffff'))
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <section id="app-startup" aria-live="polite" aria-label="Honmaru AI">
      <img src="/icon.svg" width="40" height="40" alt="" />
      <h1>Honmaru AI</h1>
      <p data-startup-message>Opening your workspace…</p>
      <a href="" data-startup-retry>Reload</a>
    </section>
    <script src="/startup-v1.js"></script>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 24px; max-width: 40ch">
        Honmaru AI needs JavaScript to show your feed. Turn it on and reload.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
